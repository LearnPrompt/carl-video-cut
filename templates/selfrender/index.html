<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Self-render 模板</title>
<link rel="icon" href="data:,">
<style>
  /* 设计规范：单强调色 / 0px 圆角 / 1px 边框 / Swiss grid / 无渐变。颜色与字体全部来自 MOTION.theme（见脚本里 setProperty）。 */
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }

  #grid i { position: absolute; top: 0; width: 1px; height: 1080px; background: var(--ink); opacity: .06; }
  .rule { position: absolute; left: 120px; width: 1680px; height: 1px; background: var(--ink); }
  #progress { position: absolute; left: 120px; top: 983px; width: 1680px; height: 3px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }

  .stage, .fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .meta { position: absolute; top: 56px; font: 500 20px/1 var(--mono); letter-spacing: .12em; }
  .meta.l { left: 120px; } .meta.r { right: 120px; }

  .col { position: absolute; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 16px; font: 600 24px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
  .kicker::before { content: ""; width: 16px; height: 16px; background: var(--accent); }
  .mask { display: block; overflow: hidden; padding: .04em 0; margin: -.04em 0; }
  .mask-in { display: block; }

  /* 标题卡 */
  .t-col { left: 120px; top: 190px; width: 1680px; gap: 44px; }
  .t-title { font: 700 236px/1.02 var(--font); letter-spacing: -.02em; }
  .t-sub { width: 760px; padding-top: 24px; border-top: 1px solid var(--ink); font: 400 40px/1.4 var(--font); }

  /* 数字对比 */
  .c-col { left: 120px; top: 190px; width: 1680px; gap: 36px; }
  .c-title { font: 700 96px/1.1 var(--font); letter-spacing: -.01em; }
  .c-new { position: absolute; left: 120px; top: 470px; width: 1000px; }
  .lab { font: 500 22px/1 var(--mono); letter-spacing: .14em; opacity: .62; }
  .c-big { margin-top: 24px; font: 700 320px/1 var(--mono); letter-spacing: -.04em; color: var(--accent); white-space: nowrap; }
  .c-big .u { font-size: 120px; letter-spacing: 0; margin-left: 12px; }
  .c-row { position: absolute; left: 1180px; width: 620px; height: 200px; border-top: 1px solid var(--ink); padding-top: 22px; }
  .c-row .v { position: relative; display: inline-block; margin-top: 18px; font: 700 120px/1 var(--mono); letter-spacing: -.03em; white-space: nowrap; }
  .c-row.old .v { opacity: .5; }
  .c-row.old .strike { position: absolute; left: -8px; right: -8px; top: 52%; height: 4px; background: var(--accent); transform-origin: 0 50%; }
  .c-row.delta .v { color: var(--accent); }

  /* 截图聚焦 */
  .f-frame { position: absolute; left: 120px; top: 210px; width: 1080px; overflow: hidden; border: 1px solid var(--ink); background: #fff; }
  .f-frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .f-spot { position: absolute; border: 1px solid var(--accent); box-shadow: 0 0 0 3000px color-mix(in srgb, var(--ink) 58%, transparent); }
  .f-col { left: 1280px; top: 210px; width: 520px; gap: 32px; }
  .f-title { font: 700 60px/1.2 var(--font); }
  .f-sub { padding-top: 22px; border-top: 1px solid var(--ink); font: 400 30px/1.6 var(--font); }
  .stage { visibility: hidden; }
</style>
</head>
<body>
<div id="root">
  <div id="grid"></div>
  <div class="rule" style="top:96px"></div>
  <div class="rule" style="top:984px"></div>
  <div id="progress"></div>
  <div id="scenes"></div>
</div>

<script src="motion.config.js"></script>
<script>
/*
  Self-render：window.__render(t) 是纯函数，画面只由 t（秒）决定，每次调用都重写全部样式，不依赖上一帧。
  配合 scripts/render_frames.mjs 使用（--dir 指向本目录）。
  约束：不用 Date.now / performance.now / 无种子 Math.random。预览用 rAF 的时间戳参数，不属于渲染路径。
  预览：直接打开 index.html 循环播放；?t=3.2 定格到某一秒。
*/
(function () {
  var M = window.MOTION, T = M.theme, root = document.getElementById('root');
  var rs = document.documentElement.style;
  rs.setProperty('--bg', T.bg); rs.setProperty('--ink', T.ink); rs.setProperty('--accent', T.accent);
  rs.setProperty('--font', T.font); rs.setProperty('--mono', T.mono);

  function mk(tag, cls, parent, text) {
    var e = document.createElement(tag); if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e); return e;
  }
  var pad2 = function (n) { return String(n).padStart(2, '0'); };
  var clamp01 = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var seg = function (t, a, b) { return b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)); };
  var EASE = {
    out: function (p) { return 1 - Math.pow(1 - p, 3); },
    io: function (p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; },
    inn: function (p) { return p * p; },
  };
  // 通用：按进度 p 设置 透明度 + 上移像素
  var setUp = function (el, p, dy) { el.style.opacity = p; el.style.transform = 'translateY(' + ((1 - p) * dy) + 'px)'; };

  var grid = document.getElementById('grid');
  for (var k = 0; k <= 12; k++) { var g = mk('i', '', grid); g.style.left = (120 + k * 142 - (k === 12 ? 24 : 0)) + 'px'; }

  var total = M.scenes.reduce(function (a, s) { return a + s.dur; }, 0);
  window.MOTION_TOTAL = total;
  window.__duration = total;
  var progress = document.getElementById('progress');

  // 每个 builder 建好 DOM，返回 draw(t, c)：c 含 tIn/tHold/tOut/end/pd，t 为绝对秒
  var BUILD = {
    title: function (sc, fx) {
      var col = mk('div', 'col t-col', fx);
      var kk = mk('div', 'kicker', col, sc.text.kicker);
      var h = mk('div', 't-title', col);
      var lines = String(sc.text.title).split('\n').map(function (t) { return mk('span', 'mask-in', mk('span', 'mask', h), t); });
      var sub = mk('div', 't-sub', col, sc.text.sub);
      return function (t, c) {
        setUp(kk, EASE.out(seg(t, c.tIn, c.tIn + c.pd * 0.6)), 20);
        lines.forEach(function (l, i) {
          var a = c.tIn + c.pd * 0.1 + i * c.pd * 0.15;
          l.style.transform = 'translateY(' + ((1 - EASE.out(seg(t, a, a + c.pd * 0.9))) * 110) + '%)';
        });
        setUp(sub, EASE.out(seg(t, c.tIn + c.pd * 0.5, c.tIn + c.pd * 1.1)), 20);
      };
    },

    compare: function (sc, fx) {
      var n = M.numbers[sc.number], dp = n.decimals == null ? 1 : n.decimals;
      var fmt = function (v) { return v.toFixed(dp); };
      var pct = Math.round((1 - n['new'] / n.old) * 100);
      var col = mk('div', 'col c-col', fx);
      var kk = mk('div', 'kicker', col, sc.text.kicker);
      var h = mk('div', 'c-title', col, sc.text.title);
      var nb = mk('div', 'c-new', fx);
      mk('div', 'lab', nb, sc.text.newLabel);
      var big = mk('div', 'c-big', nb);
      var num = mk('span', 'n', big, fmt(n.old)); mk('span', 'u', big, n.unit);
      var r1 = mk('div', 'c-row old', fx); r1.style.top = '470px';
      mk('div', 'lab', r1, sc.text.oldLabel);
      var v1 = mk('div', 'v', r1, fmt(n.old) + n.unit); var strike = mk('i', 'strike', v1);
      var r2 = mk('div', 'c-row delta', fx); r2.style.top = '700px';
      mk('div', 'lab', r2, sc.text.deltaLabel);
      mk('div', 'v', r2, (pct >= 0 ? '\u2212' : '+') + Math.abs(pct) + '%');
      return function (t, c) {
        var rollAt = c.tIn + c.pd * 0.6, rollDur = (c.tHold - rollAt) + 0.35 * (c.tOut - c.tHold);
        setUp(kk, EASE.out(seg(t, c.tIn, c.tIn + c.pd * 0.6)), 20);
        setUp(h, EASE.out(seg(t, c.tIn + c.pd * 0.15, c.tIn + c.pd * 0.95)), 20);
        setUp(nb, EASE.out(seg(t, c.tIn + c.pd * 0.3, c.tIn + c.pd * 1.1)), 20);
        setUp(r1, EASE.out(seg(t, c.tIn + c.pd * 0.5, c.tIn + c.pd * 1.3)), 20);
        num.textContent = fmt(n.old + (n['new'] - n.old) * EASE.io(seg(t, rollAt, rollAt + rollDur)));
        var sa = rollAt + rollDur * 0.7;
        strike.style.transform = 'scaleX(' + EASE.out(seg(t, sa, sa + 0.3 * rollDur)) + ')';
        var da = rollAt + rollDur * 0.85;
        setUp(r2, EASE.out(seg(t, da, da + c.pd * 0.8)), 20);
      };
    },

    focus: function (sc, fx) {
      var a = M.assets[sc.asset], sp = a.spot;
      var fr = mk('div', 'f-frame', fx); fr.style.height = Math.round(1080 * a.h / a.w) + 'px';
      var img = mk('img', '', fr); img.src = a.src;
      var spot = mk('div', 'f-spot', fr);
      var col = mk('div', 'col f-col', fx);
      var kk = mk('div', 'kicker', col, sc.text.kicker);
      var h = mk('div', 'f-title', col, sc.text.title);
      var sub = mk('div', 'f-sub', col, sc.text.sub);
      var lerp = function (x, y, p) { return x + (y - x) * p; };
      return function (t, c) {
        setUp(fr, EASE.out(seg(t, c.tIn, c.tIn + c.pd * 0.8)), 24);
        setUp(kk, EASE.out(seg(t, c.tIn + c.pd * 0.3, c.tIn + c.pd * 0.9)), 20);
        setUp(h, EASE.out(seg(t, c.tIn + c.pd * 0.45, c.tIn + c.pd * 1.15)), 20);
        setUp(sub, EASE.out(seg(t, c.tIn + c.pd * 0.7, c.tIn + c.pd * 1.4)), 20);
        var span = c.tOut - c.tHold, p = EASE.io(seg(t, c.tHold + 0.1 * span, c.tHold + 0.1 * span + 0.45 * span));
        spot.style.left = lerp(0, sp.x, p) * 100 + '%'; spot.style.top = lerp(0, sp.y, p) * 100 + '%';
        spot.style.width = lerp(1, sp.w, p) * 100 + '%'; spot.style.height = lerp(1, sp.h, p) * 100 + '%';
      };
    },
  };

  var holder = document.getElementById('scenes'), scenes = [], acc = 0;
  M.scenes.forEach(function (sc, i) {
    var s = acc, d = sc.dur, b = sc.beats;
    var c = { id: sc.id, s: s, end: s + d, tIn: s + b['in'] * d, tHold: s + b.hold * d, tOut: s + b.out * d };
    c.pd = Math.max(0.05, c.tHold - c.tIn);
    var stage = mk('div', 'stage', holder);
    mk('div', 'meta l', stage, M.meta.title);
    mk('div', 'meta r', stage, pad2(i + 1) + ' / ' + pad2(M.scenes.length));
    var fx = mk('div', 'fx', stage);
    scenes.push({ c: c, stage: stage, fx: fx, draw: BUILD[sc.type](sc, fx) });
    acc += d;
  });

  window.__render = function (t) {
    t = Math.min(Math.max(+t || 0, 0), total - 1e-6);
    progress.style.transform = 'scaleX(' + (t / total) + ')';
    scenes.forEach(function (S) {
      var c = S.c, on = t >= c.s && t < c.end;
      S.stage.style.visibility = on ? 'visible' : 'hidden';
      if (!on) return;
      S.draw(t, c);
      var po = EASE.inn(seg(t, c.tOut, c.end));
      S.fx.style.opacity = 1 - po;
      S.fx.style.transform = 'translateY(' + (-24 * po) + 'px)';
    });
  };

  // 图片 + 字体就绪后再允许渲染
  var imgs = Array.prototype.map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : Promise.resolve(); });
  window.__ready = Promise.all(imgs.concat([document.fonts ? document.fonts.ready : Promise.resolve()])).then(function () { window.__render(0); });

  // 预览（非渲染模式）：缩放到窗口，rAF 循环或 ?t= 定格
  var q = new URLSearchParams(location.search);
  if (!q.has('render')) {
    var fit = function () { root.style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')'; };
    fit(); addEventListener('resize', fit);
    if (q.has('t')) window.__render(parseFloat(q.get('t')));
    else {
      var t0 = null;
      var loop = function (ts) { if (t0 === null) t0 = ts; window.__render(((ts - t0) / 1000) % total); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  } else window.__render(0);
})();
</script>
</body>
</html>
