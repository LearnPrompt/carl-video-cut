<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>口播大剪辑</title>
<link rel="icon" href="data:,">
<style>
  /* 口播大剪辑模板。设计规范：单强调色 / 0px 圆角 / 1px 线 / Swiss grid（边距 96）/ 无渐变无发光。
     颜色字体全部来自 MOTION.theme；版式坐标集中在脚本里的 BOX 常量；文字、素材、时刻只来自 motion.config.js 和 timing.js。
     字号下限按手机看 1080p：正文 36，标签 26 以上。 */
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; line-break: strict; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #bg { background: var(--paper); overflow: hidden; }
  #bg .row { position: absolute; left: 0; white-space: nowrap; }
  #bg .w { display: inline-block; font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-weight: 900; line-height: 1; vertical-align: top; }
  #bg .w.s { color: var(--word); letter-spacing: -.02em; }
  #bg .w.o { color: transparent; font-style: italic; letter-spacing: -.01em; -webkit-text-stroke: var(--stroke) var(--word); }
  #carlwin { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; z-index: 5; }
  #carlframe { position: absolute; left: 0; top: 0; z-index: 6; outline: 1px solid var(--ink); pointer-events: none; }
  #v-carl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #scenes { z-index: 10; pointer-events: none; }
  #chrome { z-index: 20; pointer-events: none; }
  #kin { z-index: 30; pointer-events: none; }

  /* 概念文字动画（伪 AE 层）：逐字弹入、橙色底块擦过重点词、划线、整屏色块转场。只用 2D，origin 搭建时设好 */
  .ch { display: inline-block; }
  .hlw { position: relative; z-index: 0; isolation: isolate; display: inline-block; color: #fff; }
  .hlw > i.blk { position: absolute; left: -.06em; right: -.06em; top: .1em; bottom: .02em; background: var(--accent); z-index: -1; }
  .stk { position: relative; display: inline-block; }
  .stk > i.ln { position: absolute; left: -.04em; right: -.04em; top: 52%; height: .09em; background: var(--accent); }
  .k-ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .k-body { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); display: flex; align-items: center; }
  .k-card { margin: 0 96px; }
  .k-text { font: 700 112px/1.2 var(--font); letter-spacing: -.01em; color: var(--ink); }
  .k-kick { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; font: 600 34px/1 var(--mono); letter-spacing: .04em; color: var(--accent); }
  .k-kick::before { content: ""; width: 16px; height: 16px; background: var(--accent); }
  .k-bar { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--accent); }
  .k-side { position: absolute; left: 96px; top: 0; height: 1080px; display: flex; flex-direction: column; justify-content: center; }
  .k-sline { position: relative; z-index: 0; isolation: isolate; width: fit-content; margin-bottom: 12px; padding: 6px 20px 10px; font: 700 84px/1.18 var(--font); color: var(--ink); white-space: nowrap; }
  .k-sline > i.bk { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,15,18,.92); z-index: -1; }
  .k-numwrap { overflow: hidden; margin-bottom: 6px; }
  .k-num { font: 800 300px/.9 system-ui, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: -.04em; color: var(--accent); }
  .k-side .k-kick { width: fit-content; margin-bottom: 12px; padding: 10px 16px; background: rgba(14,15,18,.92); font-size: 30px; }
  #stash { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  .card { position: absolute; overflow: hidden; background: var(--bg); outline: 1px solid var(--ink); }
  .card video, .card img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.contain video, .card.contain img { object-fit: contain; }
  .credit { position: absolute; font: 500 24px/1 var(--mono); color: var(--ink); opacity: .75; letter-spacing: .02em; white-space: nowrap; }
  .credit.in { padding: 8px 14px; background: rgba(14,15,18,.86); opacity: 1; }
  .demo { position: absolute; left: 0; top: 0; padding: 8px 14px; background: var(--accent); font: 600 26px/1 var(--font); color: #fff; }
  .tag .dm { margin-left: 4px; padding: 4px 10px; background: var(--accent); font-size: 24px; color: #fff; }

  .kicker { display: flex; align-items: center; gap: 14px; width: fit-content; padding: 7px 14px 7px 12px; background: rgba(14,15,18,.86); font: 600 28px/1.2 var(--font); letter-spacing: .02em; color: var(--accent); }
  .kicker::before { content: ""; flex: none; width: 14px; height: 14px; background: var(--accent); }
  .title { font: 700 52px/1.22 var(--font); letter-spacing: -.01em; color: var(--ink); white-space: pre-line; text-wrap: balance; }
  .sub { font: 400 36px/1.4 var(--font); color: var(--ink); opacity: .86; white-space: pre-line; }
  .note { font: 500 24px/1.45 var(--mono); color: var(--ink); opacity: .78; white-space: pre; }
  .mask { display: block; overflow: hidden; }
  .mask > * { display: block; }
  .col { position: absolute; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 20px; background: rgba(14,15,18,.82); }
  .col .kicker { padding: 0; background: none; }

  .chips { position: absolute; display: flex; flex-wrap: wrap; gap: 14px 16px; }
  .chip { position: relative; padding: 10px 18px; border: 1px solid var(--ink); font: 500 36px/1.15 var(--font); color: var(--ink); white-space: nowrap; background: rgba(14,15,18,.8); }
  .chip .hl { position: absolute; inset: -1px; background: var(--accent); transform-origin: 0 50%; z-index: 0; }
  .chip span { position: relative; z-index: 1; }
  .chip .x { position: absolute; left: 12px; right: 12px; top: 52%; height: 4px; background: var(--accent); transform-origin: 0 50%; z-index: 2; }
  .arrow { align-self: center; font: 500 36px/1 var(--mono); color: var(--ink); opacity: .7; }

  .panel { position: absolute; padding: 24px 32px 28px; background: rgba(14,15,18,.9); outline: 1px solid rgba(237,234,228,.28); display: flex; flex-direction: column; gap: 14px; }
  .panel .title { font-size: 60px; }
  .panel .kicker { padding: 0; background: none; }
  .panel .chips { position: static; margin-top: 6px; }
  .tag { position: absolute; left: 96px; top: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(14,15,18,.86); font: 600 26px/1 var(--font); letter-spacing: .04em; color: var(--ink); white-space: nowrap; }
  .tag::before { content: ""; width: 12px; height: 12px; background: var(--accent); }
  .tag.lab { font-size: 30px; letter-spacing: 0; }

  .biglabel { position: absolute; left: 96px; bottom: 96px; display: flex; flex-direction: column; gap: 12px; padding: 20px 28px 24px; background: rgba(14,15,18,.88); }
  .biglabel .kicker { padding: 0; background: none; }
  .biglabel .title { font-size: 72px; }

  .quote { position: relative; overflow: hidden; padding: 44px 52px; background: var(--bg); outline: 1px solid var(--ink); font: 500 40px/1.65 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-all; }
  .quote .q-k { display: flex; margin-bottom: 26px; padding: 0; background: none; }
  .qline { position: absolute; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; background: var(--bg); outline: 1px solid var(--ink); font: 500 32px/1.45 var(--mono); color: var(--ink); }
  .qline .kicker { padding: 0; background: none; }
  .qline > div { white-space: pre-wrap; }
  .qline .cur, .quote .cur { display: inline-block; width: .55em; height: 1em; vertical-align: -.12em; background: var(--accent); }

  .tl { position: absolute; height: 128px; }
  .tl .strip { position: absolute; left: -16px; right: -16px; top: -44px; bottom: -8px; background: rgba(14,15,18,.86); }
  .tl .rule { position: absolute; left: 0; right: 0; top: 60px; height: 1px; background: var(--ink); }
  .tl .tick { position: absolute; top: 44px; width: 1px; height: 32px; background: var(--ink); opacity: .7; }
  .tl .tlab { position: absolute; top: 88px; transform: translateX(-50%); font: 500 26px/1 var(--mono); color: var(--ink); opacity: .85; white-space: nowrap; }
  .tl .head { position: absolute; top: 20px; left: 0; width: 3px; height: 80px; margin-left: -1px; background: var(--accent); }
  .tl .read { position: absolute; top: -32px; left: 0; font: 700 36px/1 var(--mono); color: var(--accent); white-space: nowrap; }
  .tl .ev { position: absolute; top: -10px; transform: translateX(-50%); padding: 8px 14px; background: var(--accent); color: #fff; font: 600 30px/1 var(--font); white-space: nowrap; }
  .tl .demo { left: auto; right: 0; top: -40px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="TOTAL">
  <div id="bg" class="layer"></div>
  <div id="carlwin"></div>
  <div id="carlframe"></div>
  <div id="scenes" class="layer"></div>
  <div id="chrome" class="layer"></div>
  <div id="kin" class="layer"></div>
  <div id="stash">
  <!--MEDIA-->
  </div>
</div>

<script src="motion.config.js"></script>
<script src="timing.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  // 约束：画面只由 t 决定。不用 Date.now / performance.now / 无种子 Math.random / CSS 动画；所有变化都挂在一条暂停的 GSAP 时间线上。
  var M = window.MOTION, T = window.MOTION_T, TH = M.theme, P = M.brand.pattern;
  var W = 1920, H = 1080;
  var rs = document.documentElement.style;
  [['--bg', TH.bg], ['--paper', P.bg], ['--word', P.word], ['--ink', TH.ink], ['--accent', TH.accent],
   ['--font', TH.font], ['--mono', TH.mono], ['--stroke', P.stroke + 'px']].forEach(function (kv) { rs.setProperty(kv[0], kv[1]); });

  // 版式坐标（1080p）。pip：卡片区和右栏之间留 96，卡片上沿留出条目名和署名的一行
  var BOX = {
    pip:   { card: [96, 176, 1200, 669], col: [1392, 176, 432], win: [1392, 452, 432, 393], chipsY: 884 },
    split: { card: [96, 260, 1056, 594], head: [96, 120], strip: [1200, 0, 720, 1080], chipsGap: 32 },
    side:  { x: 96, cy: 540, maxW: 760, minW: 420, maxH: 560, faceGap: 72 },
    grid:  { top: 264, quoteTop: 420, gap: 24 },
    full:  { pad: 96, maxW: 0.55 },
    talk:  { x: 64, bottom: 64 },
  };
  var CROP = 700;                                   // 小窗里取脸周围多大一块原画面（px），大一点给晃动留余量

  function mk(tag, cls, parent, text) {
    var e = document.createElement(tag); if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e); return e;
  }
  function px(e, x, y, w, h) { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; }
  function fit(aw, ah, bw, bh) { var r = Math.min(bw / aw, bh / ah); return [Math.round(aw * r), Math.round(ah * r)]; }
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  // 只用 2D transform：真 3D（rotationY + perspective）在 Chrome 里走合成层，入场中途的帧截图会随页面加载时机变，确定性检查过不了
  // （GSAP 数值逐项一致、截图不一致，2026-10-22 实测）。force3D:false 让 GSAP 补间中也写 2D 的 translate，不提升合成层。
  // lazy:false：补间第一次被 seek 到时当场写值，不拖到下一个 tick。
  gsap.config({ force3D: false });
  var tl = gsap.timeline({ paused: true, defaults: { lazy: false } });
  var E = { out: 'power3.out', io: 'power2.inOut' };
  var show = function (el, t0, t1) {                // 在 [t0, t1) 内可见；用零时长 set，前后 seek 都可逆
    tl.set(el, { autoAlpha: 1 }, t0);
    if (t1 != null && t1 < T.duration) tl.set(el, { autoAlpha: 0 }, t1);
  };
  // transformOrigin 一律在搭建时一次设好，不写进补间：补间里带的 origin 往回 seek 时会被还原成默认值、再往前不会重设，
  // 同一时刻的画面就随 seek 历史变（确定性检查实测，入场途中的帧错位）。
  var origin = function (el, o) { gsap.set(el, { transformOrigin: o }); };
  // 仿 3D 入场的 2D 版：卡片从左沿收着推进来（横向先窄、略矮，左沿为轴放开）
  var enter = function (el, at, extra) {
    origin(el, '0% 50%');
    tl.fromTo(el, Object.assign({ x: -28, scaleX: 0.9, scaleY: 0.96 }, extra && extra.from),
      Object.assign({ x: 0, scaleX: 1, scaleY: 1, duration: 0.6, ease: E.out, immediateRender: false }, extra && extra.to), at);
  };
  var fadeUp = function (el, at, d) { tl.fromTo(el, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: d || 0.4, ease: E.out }, at); };
  var maskUp = function (el, at, d) { tl.fromTo(el, { yPercent: 105 }, { yPercent: 0, duration: d || 0.45, ease: E.out }, at); };

  // ---------- 品牌底：重复字漂移（位移对单元宽取模，任意 t 无缝） ----------
  (function brand() {
    var bg = document.getElementById('bg'), D = M.brand.drift;
    var probe = function (cls, text) {
      var e = mk('span', 'w ' + cls, bg, text); e.style.fontSize = P.size + 'px'; e.style.position = 'absolute'; e.style.visibility = 'hidden';
      var w = e.getBoundingClientRect().width; bg.removeChild(e); return w;
    };
    var gapPx = P.gap * P.size, wS = probe('s', P.solid), wO = probe('o', P.outline), U = wS + wO + 2 * gapPx;
    var speed = U / D.loop, nRows = Math.ceil(H / P.rowH) + 1, reps = Math.ceil(W / U) + 2;
    var top0 = (H - (nRows - 1) * P.rowH - P.size) / 2;
    for (var i = 0; i < nRows; i++) {
      var r = mk('div', 'row', bg); r.style.top = (top0 + i * P.rowH) + 'px';
      for (var k = 0; k < reps; k++) {
        var s = mk('span', 'w s', r, P.solid); s.style.fontSize = P.size + 'px'; s.style.width = (wS + gapPx) + 'px';
        var o = mk('span', 'w o', r, P.outline); o.style.fontSize = P.size + 'px'; o.style.width = (wO + gapPx) + 'px';
      }
      var base = (i % 2) ? (wS + gapPx) : 0, dir = (i % 2) ? 1 : -1;
      (function (base, dir) {
        tl.fromTo(r, { x: 0 }, { x: 1, duration: T.duration, ease: 'none', immediateRender: true,
          modifiers: { x: function (v) { var t = parseFloat(v) * T.duration; var m = ((base + dir * speed * t) % U + U) % U; return (m - U).toFixed(2) + 'px'; } } }, 0);
      })(base, dir);
    }
  })();

  // ---------- 真人：一个视频元素，按场景换位置和裁切 ----------
  var win = document.getElementById('carlwin'), carl = document.getElementById('v-carl'), frame = document.getElementById('carlframe');
  win.appendChild(carl);
  gsap.set([win, frame], { transformOrigin: '50% 50%' });
  var prevMode = null;
  function carlAt(t0, rect, face, mode) {
    var x = rect[0], y = rect[1], w = rect[2], h = rect[3], s = 1, vx = 0, vy = 0;
    if (mode === 'win') {                            // 小窗：取脸周围 CROP 宽的一块，缩到窗口大小，脸略偏上
      s = w / CROP;
      var ch = h / s, fx = face.cx * W, fy = face.cy * H;
      vx = -clamp(fx - CROP / 2, 0, W - CROP) * s; vy = -clamp(fy - ch * 0.48, 0, H - ch) * s;
    } else if (mode === 'strip') {                   // 竖条：原大小，按脸水平居中
      vx = -clamp(face.cx * W - w / 2, 0, W - w);
    }
    tl.set(win, { x: x, y: y, width: w, height: h, autoAlpha: mode === 'hide' ? 0 : 1 }, t0);
    tl.set(carl, { x: vx, y: vy, scale: s }, t0);
    tl.set(frame, { x: x, y: y, width: w, height: h, autoAlpha: mode === 'win' || mode === 'strip' ? 1 : 0 }, t0);
    if (mode === 'win' && prevMode !== 'win')       // 从别的版式切进小窗时，小窗淡入并轻轻放大一次
      tl.fromTo([win, frame], { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: E.out, immediateRender: false }, t0);
    prevMode = mode;
  }

  // ---------- 通用部件 ----------
  function mediaEl(sc, j) {
    var it = sc.items[j], md = T.media[it.m];
    if (!md) return mk('div');
    if (md.img) { var im = mk('img'); im.src = md.src; return im; }
    return document.getElementById('v-' + sc.id + '-' + j);
  }
  function byOf(it, c) { return c.by || (M.media[it.m] || {}).by; }
  function zoomMedia(el, it, c) {                    // 条目 zoom: {x, y, s, to}：以 (x, y) 为中心放大 s 倍，可在条目时长内慢慢推到 to
    var z = c.zoom; if (!z) return;
    var o = (z.x * 100) + '% ' + (z.y * 100) + '%';
    origin(el, o);
    if (z.to) tl.fromTo(el, { scale: z.s }, { scale: z.to, duration: it.t1 - it.t0, ease: 'none', immediateRender: true }, it.t0);
    else gsap.set(el, { scale: z.s });
  }
  // 一组素材依次出现在同一个卡位。卡框比例取这一场素材比例的中位数，比例不同的条目在框里 contain，同一场里卡框不跳；
  // 第一条带仿 3D 入场（右沿往里收，不会冲出卡位），后面的条目短滑入。条目名放卡框上沿外左侧，署名放上沿外右侧，不压素材。
  function cards(layer, sc, cfg, box, align, opts) {
    opts = opts || {};
    var ars = sc.items.map(function (it) { var m = T.media[it.m]; return m ? m.w / m.h : 16 / 9; }).sort(function (a, b) { return a - b; });
    var ar = ars.length ? ars[Math.floor((ars.length - 1) / 2)] : 16 / 9;
    var md0 = { w: ar * 1000, h: 1000 }, sz = fit(md0.w, md0.h, box[2], box[3]);
    var x = box[0], y = box[1];
    if (align === 'center') { x = box[0] + (box[2] - sz[0]) / 2; y = box[1] + (box[3] - sz[1]) / 2; }
    else if (align === 'left-mid') { y = box[1] + (box[3] - sz[1]) / 2; }
    else if (align === 'top-center') { x = box[0] + (box[2] - sz[0]) / 2; }
    return sc.items.map(function (it, j) {
      var c = cfg.items[j] || {}, md = T.media[it.m] || md0;
      var same = Math.abs(md.w / md.h - md0.w / md0.h) < 0.02;
      var card = mk('div', 'card' + (same ? '' : ' contain'), layer); px(card, x, y, sz[0], sz[1]);
      var el = mediaEl(sc, j); card.appendChild(el); zoomMedia(el, it, c);
      var demo = c.demo || (M.media[it.m] || {}).demo;
      gsap.set(card, { autoAlpha: 0 }); show(card, it.t0, it.t1);
      if (j === 0) enter(card, it.t0);
      else tl.fromTo(card, { x: 36 }, { x: 0, duration: 0.3, ease: E.out, immediateRender: false }, it.t0);
      // 标注位置：默认卡片上沿外；opts.under 时放下沿外，卡片右边留得出 320 就改放右侧、和卡片底对齐
      var lab = c.label, by = byOf(it, c), beside = opts.under && box[0] + box[2] - (x + sz[0]) >= 320;
      var place = opts.under && !beside ? y + sz[1] + 14 : null, stack = lab && sz[0] < 640;   // 窄卡片署名另起一行，不和条目名挤
      if (lab || demo) {                             // 示意标记挂在条目名后面，同在卡片外
        var b = mk('div', 'tag lab', layer, lab || null); if (demo) mk('span', 'dm', b, '示意');
        if (beside) { b.style.left = (x + sz[0] + 24) + 'px'; b.style.top = (y + sz[1] - 108) + 'px'; }
        else { b.style.left = x + 'px'; b.style.top = (place != null ? place : y - 58) + 'px'; }
        gsap.set(b, { autoAlpha: 0 }); show(b, it.t0, it.t1);
      }
      if (by) {
        var cr = mk('div', 'credit' + (opts.creditIn ? ' in' : ''), layer, by);
        if (beside) { cr.style.left = (x + sz[0] + 24) + 'px'; cr.style.top = (y + sz[1] - 30) + 'px'; }
        else { cr.style.left = x + 'px'; cr.style.width = sz[0] + 'px'; cr.style.textAlign = 'right'; cr.style.top = (place != null ? place + (stack ? 62 : 12) : y - 36) + 'px'; }
        gsap.set(cr, { autoAlpha: 0 }); show(cr, it.t0, it.t1);
      }
      return { el: card, x: x, y: y, w: sz[0], h: sz[1], it: it, under: place != null, stack: stack };
